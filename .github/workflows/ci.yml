name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Type check
        run: mypy . --exclude '.venv|__pycache__|hooks/tests'

      - name: Tests
        run: pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

      - name: End-to-end smoke (run.sh, MCP stdio, commit gate)
        run: python .github/scripts/smoke_e2e.py

  windows:
    name: windows-${{ matrix.arch }} (Git Bash)
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
          - os: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash  # Git Bash, the shell Claude Code uses on Windows
    steps:
      # Match a stock Git for Windows install, which checks files out with CRLF.
      - name: Enable autocrlf
        run: git config --global core.autocrlf true

      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: ${{ matrix.arch }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ".[dev]"

      - name: End-to-end smoke (run.sh, MCP stdio, commit gate)
        timeout-minutes: 15
        run: python .github/scripts/smoke_e2e.py

      - name: Tests
        if: ${{ !cancelled() }}
        run: pytest

      - name: Upload server log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-log-windows-${{ matrix.arch }}
          path: logs/
